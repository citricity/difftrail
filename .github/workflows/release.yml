# Builds Diff Trail for macOS, Linux and Windows when a GitHub release is
# published, uploads the installers to that release, then redeploys the docs
# site so its download button points at them.
#
# To ship a version: create a release in GitHub with a tag such as `v0.2.0` and
# publish it. The version in the tag is the version that gets built; there is no
# need to bump `tauri.conf.json` first.
#
# To rebuild an existing release (a flaky runner, a fixed workflow), run this
# workflow by hand with that release's tag. Assets with the same name are
# replaced.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build and upload to (e.g. v0.2.0)
        required: true

# One build per tag at a time; a second run for the same tag waits rather than
# racing the first to upload the same asset names.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
      msi: ${{ steps.release.outputs.msi }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id) || {
            echo "::error::No release exists for tag '$TAG'."
            exit 1
          }

          # The tag is the version: v1.2.3 or 1.2.3, with an optional pre-release.
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          # WiX (the .msi) only accepts a numeric pre-release such as 1.2.3-4.
          # Anything else still gets the NSIS installer, just not the .msi.
          msi=true
          if [[ "$version" == *-* && ! "$version" =~ -[0-9]+$ ]]; then
            msi=false
            echo "::notice::'$version' has a non-numeric pre-release, so no .msi will be built."
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "id=$id"
            echo "msi=$msi"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: resolve
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal build runs natively on both Apple Silicon and Intel,
          # so the download page never has to guess which Mac it is on — which
          # a browser's user agent cannot tell it.
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu, because an AppImage runs on systems
          # with a glibc at least as new as the one it was built against.
          - name: Linux
            runner: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Windows
            runner: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Set the app version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '
          echo "Building Diff Trail $VERSION"

      # Signing is optional. With the Apple secrets set, the app is signed with
      # a Developer ID and notarised. Without them it is signed ad hoc, which
      # Apple Silicon requires before it will run a downloaded app at all;
      # users then confirm it once in System Settings (see the docs page).
      #
      # The secrets are only exported when present, so an unset secret never
      # reaches Tauri as an empty certificate or identity.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                        APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              value="${!name}"
              if [[ -n "$value" ]]; then
                echo "::add-mask::$value"
                delimiter="EOF_$(uuidgen)"
                printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
              fi
            done
            echo "Signing with a Developer ID certificate."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::No Apple certificate configured; the macOS build is signed ad hoc."
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.resolve.outputs.release-id }}
          tagName: ${{ needs.resolve.outputs.tag }}
          # Diff Trail has no updater, so there is no latest.json or signature
          # to publish.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: >-
            ${{ matrix.args }}
            ${{ runner.os == 'Windows' && needs.resolve.outputs.msi == 'false' && '--bundles nsis' || '' }}
          retryAttempts: 1

  docs:
    name: Update docs
    needs: [resolve, build]
    # Publish the docs even if one platform failed, so the platforms that did
    # build are downloadable. The page only offers assets that exist.
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # dispatch the docs workflow
    steps:
      # Dispatched rather than called as a reusable workflow: this run belongs
      # to the tag, and the github-pages environment only accepts deployments
      # from the default branch unless its rules are loosened.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docs.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}"
