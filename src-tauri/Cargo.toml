[package]
name = "diff-trek"
version = "0.1.0"
description = "A fast continuous Git diff viewer"
authors = ["Diff Trek"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "diff_trek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
